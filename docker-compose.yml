services:

  mcp-uptime-kuma:
    image: davidfuchs/mcp-uptime-kuma:latest
    container_name: mcp-uptime-kuma
    environment:
      - UPTIME_KUMA_URL=${UPTIME_KUMA_URL} # Required
#      - UPTIME_KUMA_USERNAME=${UPTIME_KUMA_USERNAME} # Optional, if using username/password authentication
#      - UPTIME_KUMA_PASSWORD=${UPTIME_KUMA_PASSWORD} # Optional, if using username/password authentication
#      - UPTIME_KUMA_JWT_TOKEN=${UPTIME_KUMA_JWT_TOKEN} # Optional, if using JWT authentication
#      - PORT=3000 # Internal port. This is optional, defaults to 3000
    ports:
      - "3005:3000"
    volumes:
      # Temporary hotfix: run the locally built output instead of the image-bundled dist.
      # Re-run `npm run build` before restarting this container after source changes.
      - ./dist:/app/dist:ro
    # Override default CMD to use streamable HTTP transport instead of stdio
    command: ["-t", "streamable-http"]
    restart: unless-stopped
